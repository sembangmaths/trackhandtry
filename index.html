<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padan Jawapan</title>
<style>
  :root{--bg:#1b2a41;--ink:#fdf6e3;--accent:#f4a261;--panel:rgba(27,42,65,.93)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
  video{display:none}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px;font-size:20px;font-weight:700;text-shadow:0 2px 6px #000a;pointer-events:none}
  #cam{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);right:12px;background:var(--panel);color:var(--ink);border:2px solid var(--accent);border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;display:none}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:var(--panel)}
  h1{font-size:clamp(38px,9vw,68px);margin:0;color:var(--accent);letter-spacing:-1px}
  p{margin:0;max-width:38ch;line-height:1.5;font-size:18px}
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .ops button{background:var(--accent);color:#2a1500;border:0;border-radius:14px;padding:16px 22px;font:inherit;font-size:20px;font-weight:800}
  .ops button:disabled{opacity:.6}
  #msg{min-height:22px;font-size:15px;color:#ffd9a0}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="hud" hidden><span id="sk">0</span><span id="mas">90s</span><span id="ny">❤️❤️❤️</span></div>
<button id="cam">Tukar kamera</button>
<div id="menu">
  <h1>Padan Jawapan</h1>
  <p>Cubit kad soalan dengan ibu jari dan telunjuk, seret, kemudian lepaskan atas jawapan yang betul.</p>
  <p id="rek"></p>
  <div class="ops">
    <button data-op="+">Tambah</button>
    <button data-op="-">Tolak</button>
    <button data-op="x">Darab</button>
    <button data-op="?">Campur</button>
  </div>
  <div id="msg"></div>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const v=$("v"),c=$("c"),ctx=c.getContext("2d");
let W,H;
function saiz(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);if(kad)susun()}
let kad=null;
addEventListener("resize",saiz);

let hand=null,mode="user",jalan=false;
let rekod=0;try{rekod=+localStorage.getItem("pj_rekod")||0}catch(e){}
$("rek").textContent=rekod?"Rekod terbaik: "+rekod:"";

async function bukaKamera(){
  if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode,width:480,height:360},audio:false});
  await v.play();
}
async function muat(){
  const m=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
  const vis=await m.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const baseOptions={modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"};
  try{hand=await m.HandLandmarker.createFromOptions(vis,{baseOptions:{...baseOptions,delegate:"GPU"},runningMode:"VIDEO",numHands:1})}
  catch(e){hand=await m.HandLandmarker.createFromOptions(vis,{baseOptions,runningMode:"VIDEO",numHands:1})}
}

// ---- Game ----
let op,skor,nyawa,masa,jari,pecah,lastT,lastV=-1,tamat,aktif=false,rehat=0,pegang=null,cw,ch;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function pasangan(){
  const mx=10+Math.min(15,Math.floor((90-masa)/8));
  const s=new Set(),r=[];let g=0;
  while(r.length<4&&g++<200){
    const o=op==="?"?["+","-","x"][rnd(0,2)]:op;let a,b,j,q;
    if(o==="+"){a=rnd(1,mx);b=rnd(1,mx);j=a+b;q=a+" + "+b}
    else if(o==="-"){a=rnd(2,mx+5);b=rnd(1,a);j=a-b;q=a+" − "+b}
    else{a=rnd(2,9);b=rnd(2,9);j=a*b;q=a+" × "+b}
    if(s.has(j))continue;s.add(j);r.push({q,j});
  }
  return r;
}
function bundar(){
  const p=pasangan();
  const order=[0,1,2,3].sort(()=>Math.random()-.5);
  kad=p.map((x,i)=>({q:x.q,j:x.j,slot:order[i],hx:0,hy:0,x:0,y:0,siap:false}));
  pegang=null;susun();
  for(const k of kad){k.x=k.hx;k.y=k.hy}
}
function susun(){
  cw=Math.min(W/4.5,150);ch=cw*.72;
  for(let i=0;i<kad.length;i++){
    const k=kad[i];
    k.hx=W*(i+.5)/4;k.hy=H*.27;
    k.tx=W*(k.slot+.5)/4;k.ty=H*.74;
    if(!k.siap&&k!==pegang){k.x=k.hx;k.y=k.hy}
    if(k.siap){k.x=k.tx;k.y=k.ty}
  }
}
function reset(){skor=0;nyawa=3;masa=90;pecah=[];tamat=false;rehat=0;jari={x:W/2,y:H/2,ada:false,cubit:false};bundar()}
function letup(x,y,txt,w){pecah.push({x,y,txt,w,t:0})}

function sasaran(k){
  let best=null,bd=1e9;
  for(const t of kad){
    if(t.siap)continue;
    const d=Math.hypot(k.x-t.tx,k.y-t.ty);
    if(d<bd){bd=d;best=t}
  }
  return bd<cw*.75?best:null;
}
function lepas(){
  const k=pegang;pegang=null;if(!k)return;
  const t=sasaran(k);
  if(!t)return;               // dilepas di luar sasaran: kad balik, tiada penalti
  if(t===k){k.siap=true;k.x=k.tx;k.y=k.ty;skor+=10;letup(k.tx,k.ty-ch,"✔ +10","#52d681");
    if(kad.every(z=>z.siap)){skor+=10;letup(W/2,H*.5,"Lengkap! +10","#ffd166");rehat=1}}
  else{nyawa--;letup(t.tx,t.ty-ch,"✘ -1❤️","#ff5a4e")}
}

function update(dt){
  if(tamat)return;
  masa-=dt;$("mas").textContent=Math.max(0,Math.ceil(masa))+"s";
  if(masa<=0||nyawa<=0)return akhir();
  if(rehat>0){rehat-=dt;if(rehat<=0)bundar();return}
  // cubit
  if(jari.ada&&jari.cubit&&!pegang&&!jari.tadiCubit){
    let best=null,bd=1e9;
    for(const k of kad){
      if(k.siap)continue;
      if(Math.abs(jari.x-k.x)<cw/2+30&&Math.abs(jari.y-k.y)<ch/2+30){
        const d=Math.hypot(jari.x-k.x,jari.y-k.y);if(d<bd){bd=d;best=k}
      }
    }
    if(best)pegang=best;
  }
  if(pegang&&(!jari.ada||!jari.cubit))lepas();
  jari.tadiCubit=jari.cubit&&jari.ada;
  for(const k of kad){
    if(k.siap)continue;
    const tx=k===pegang?jari.x:k.hx,ty=k===pegang?jari.y:k.hy;
    const f=k===pegang?.5:.18;
    k.x+=(tx-k.x)*f;k.y+=(ty-k.y)*f;
  }
  $("sk").textContent="⭐ "+skor;
  $("ny").textContent="❤️".repeat(Math.max(0,nyawa));
  for(const p of pecah)p.t+=dt;
  pecah=pecah.filter(p=>p.t<.9);
}

function kotak(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,r)}
function lukis(){
  ctx.clearRect(0,0,W,H);
  if(v.readyState>=2){
    ctx.save();
    if(mode==="user"){ctx.translate(W,0);ctx.scale(-1,1)}
    ctx.globalAlpha=.9;ctx.drawImage(v,0,0,W,H);
    ctx.restore();
    ctx.fillStyle="rgba(27,42,65,.45)";ctx.fillRect(0,0,W,H);
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  if(aktif&&kad){
    const fs=Math.round(cw*.34);
    const hover=pegang?sasaran(pegang):null;
    // sasaran jawapan
    for(const k of kad){
      kotak(k.tx,k.ty,cw,ch,14);
      if(k.siap){ctx.fillStyle="rgba(82,214,129,.9)";ctx.fill()}
      else{ctx.fillStyle=hover===k?"rgba(244,162,97,.45)":"rgba(255,255,255,.14)";ctx.fill();
        ctx.setLineDash([8,6]);ctx.lineWidth=3;ctx.strokeStyle=hover===k?"#f4a261":"#fffb";ctx.stroke();ctx.setLineDash([])}
      ctx.fillStyle=k.siap?"#10331d":"#fff";ctx.font="bold "+fs+"px 'Trebuchet MS',sans-serif";
      ctx.fillText(k.siap?k.q+" = "+k.j:k.j,k.tx,k.ty);
      if(k.siap){ctx.font="bold "+Math.round(fs*.6)+"px sans-serif"}
    }
    // kad soalan
    for(const k of kad){
      if(k.siap)continue;
      const p=k===pegang;
      ctx.save();
      ctx.shadowColor="#0009";ctx.shadowBlur=p?22:8;ctx.shadowOffsetY=p?10:3;
      kotak(k.x,k.y,cw*(p?1.08:1),ch*(p?1.08:1),14);
      ctx.fillStyle=p?"#ffd166":"#fdf6e3";ctx.fill();
      ctx.restore();
      ctx.fillStyle="#2a1500";ctx.font="bold "+fs+"px 'Trebuchet MS',sans-serif";
      ctx.fillText(k.q,k.x,k.y);
    }
  }
  for(const p of pecah){ctx.globalAlpha=1-p.t/.9;ctx.fillStyle=p.w;ctx.font="bold 28px sans-serif";ctx.fillText(p.txt,p.x,p.y-p.t*60)}
  ctx.globalAlpha=1;
  if(jari&&jari.ada){
    ctx.beginPath();ctx.arc(jari.x,jari.y,jari.cubit?14:22,0,7);
    if(jari.cubit){ctx.fillStyle="#f4a261";ctx.fill()}
    ctx.lineWidth=4;ctx.strokeStyle="#f4a261";ctx.stroke();
  }
}

function kesan(){
  if(!hand||v.readyState<2||v.currentTime===lastV)return;
  lastV=v.currentTime;
  const r=hand.detectForVideo(v,performance.now());
  if(r.landmarks.length){
    const L=r.landmarks[0],vw=v.videoWidth||4,vh=v.videoHeight||3;
    const d=(a,b)=>Math.hypot((a.x-b.x)*vw,(a.y-b.y)*vh);
    const nisbah=d(L[4],L[8])/(d(L[0],L[9])||1);
    // histeresis: cubit bermula <0.35, dilepas >0.55
    if(jari.cubit)jari.cubit=nisbah<.55;else jari.cubit=nisbah<.35;
    const mx=(L[4].x+L[8].x)/2,my=(L[4].y+L[8].y)/2;
    const tx=(mode==="user"?1-mx:mx)*W,ty=my*H;
    if(!jari.ada){jari.x=tx;jari.y=ty}
    jari.x+=(tx-jari.x)*.55;jari.y+=(ty-jari.y)*.55;jari.ada=true;
  }else{jari.ada=false;jari.cubit=false}
}

function akhir(){
  tamat=true;aktif=false;pegang=null;
  let baru=false;
  if(skor>rekod){rekod=skor;baru=true;try{localStorage.setItem("pj_rekod",rekod)}catch(e){}}
  $("hud").hidden=true;$("cam").style.display="none";
  $("menu").style.display="flex";
  $("menu").querySelector("h1").textContent=nyawa<=0?"Nyawa habis!":"Masa tamat!";
  $("menu").querySelectorAll("p")[0].textContent="Markah anda: "+skor+(baru?" 🎉 Rekod baharu!":"")+". Pilih operasi untuk main lagi.";
  $("rek").textContent="Rekod terbaik: "+rekod;
  document.querySelectorAll(".ops button").forEach(b=>b.disabled=false);
}

function gelung(t){
  const dt=Math.min(.05,(t-(lastT||t))/1000);lastT=t;
  kesan();update(dt);lukis();
  requestAnimationFrame(gelung);
}

document.querySelectorAll(".ops button").forEach(btn=>btn.onclick=async()=>{
  document.querySelectorAll(".ops button").forEach(b=>b.disabled=true);
  $("msg").textContent="";op=btn.dataset.op;
  try{
    if(!jalan){
      $("msg").textContent="Membuka kamera dan memuat model...";
      await bukaKamera();await muat();jalan=true;
      requestAnimationFrame(gelung);
    }
    reset();aktif=true;
    $("menu").style.display="none";$("hud").hidden=false;$("cam").style.display="block";
  }catch(e){
    $("msg").textContent="Gagal: benarkan kamera dan pastikan guna https atau localhost, serta ada internet.";
    document.querySelectorAll(".ops button").forEach(b=>b.disabled=false);
  }
});
$("cam").onclick=async()=>{mode=mode==="user"?"environment":"user";try{await bukaKamera()}catch(e){}};
saiz();
</script>
</body>
</html>
