<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Body Runner – Lari Guna Gerak Badan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1740;--gold:#ffd75e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--ink);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;font-weight:600;color:#fff;touch-action:none}
canvas#g{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;pointer-events:none;font-weight:800;font-size:clamp(16px,4vw,24px)}
#hud span{background:rgba(20,14,60,.6);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.2);border-radius:999px;padding:0 16px;line-height:1.5}
#sc{color:var(--gold);font-size:1.35em}
#cam{position:fixed;left:10px;bottom:max(10px,env(safe-area-inset-bottom));width:140px;height:105px;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.45);transform:scaleX(-1);background:#000;display:none;z-index:5}
#cam.big{width:280px;height:210px;left:calc(50% - 140px);bottom:12%}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#pad{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:none;gap:8px;z-index:7}
#pad button{width:56px;height:56px;padding:0;font-size:22px;border-radius:50%}
#dbg{position:fixed;left:50%;transform:translateX(-50%);bottom:max(6px,env(safe-area-inset-bottom));font-size:12px;opacity:.65;z-index:7;pointer-events:none;white-space:nowrap}
#flash{position:fixed;top:24%;left:0;right:0;text-align:center;font-size:clamp(34px,9vw,72px);font-weight:800;color:var(--gold);-webkit-text-stroke:2px #7a2d00;paint-order:stroke fill;text-shadow:0 5px 0 #7a2d00;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:16px;overflow-y:auto;background:radial-gradient(120% 90% at 50% 10%,rgba(70,36,150,.72),rgba(14,10,40,.94));backdrop-filter:blur(5px)}
.card{margin:auto;width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px 20px 24px;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.25);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.seg{display:flex;align-self:flex-end;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{font-size:13px;padding:2px 14px;border-radius:999px;background:transparent;color:#fff;box-shadow:none}
.seg button.on{background:#fff;color:var(--ink)}
.logo{font-size:clamp(46px,14vw,72px);font-weight:800;line-height:.9;color:var(--gold);transform:rotate(-2deg);text-shadow:0 3px 0 #e0780c,0 6px 0 #8a3500,0 14px 20px rgba(0,0,0,.45)}
.tag{font-size:18px;line-height:1.2}
.tip{font-size:13px;line-height:1.35;opacity:.75;max-width:340px}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.moves div{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.16);border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px}
.moves b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(#ffe27a,#ffa21f);color:#4a2400;font-size:22px;box-shadow:0 3px 0 #c76a00}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
button.th{display:flex;flex-direction:column;gap:5px;align-items:center;padding:6px 4px 5px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;box-shadow:none;border:2px solid transparent}
button.th i{display:block;width:100%;height:42px;border-radius:11px;box-shadow:inset 0 -10px 14px rgba(0,0,0,.25)}
button.th.on{border-color:var(--gold);background:rgba(255,215,94,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:800;border:0;cursor:pointer;font-size:18px;padding:10px 24px;border-radius:18px;color:#4a2400;background:linear-gradient(#ffe27a,#ffa21f);box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 6px 0 #c76a00,0 12px 18px rgba(0,0,0,.35);transition:transform .08s}
button:active{transform:translateY(4px)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.28);font-size:14px;padding:5px 16px;border-radius:999px}
#bCam{font-size:22px;padding:13px 30px;width:100%}
.big{font-size:clamp(60px,18vw,96px);font-weight:800;line-height:.9;color:var(--gold);text-shadow:0 4px 0 #8a3500,0 12px 20px rgba(0,0,0,.4)}
.nb{background:#ff4f8b;border-radius:999px;padding:1px 16px;font-size:15px;font-weight:800;transform:rotate(-3deg)}
#calib{position:fixed;top:max(56px,8%);left:50%;transform:translateX(-50%);z-index:8;width:min(340px,90vw);text-align:center;background:rgba(20,14,60,.82);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.25);padding:14px 18px;border-radius:20px;display:flex;flex-direction:column;gap:8px;align-items:center}
.bar{width:100%;height:16px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2de2c4,#ffd75e)}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud"><span id="sc">0</span><span id="co">🪙 0</span><span id="lv"></span></div>
<div id="flash"></div>
<div id="dbg"></div>
<div id="pad"><button data-a="L">⬅</button><button data-a="U">⬆</button><button data-a="D">⬇</button><button data-a="R">➡</button></div>
<div id="cam"><video id="v" playsinline muted></video><canvas id="o"></canvas></div>

<div class="ov" id="menu"><div class="card">
  <div class="seg"><button data-l="ms">BM</button><button data-l="en">EN</button></div>
  <h1 class="logo">BODY<br>RUNNER</h1>
  <p class="tag" data-i="tag"></p>
  <div class="moves"><div><b>↔</b><span data-i="m1"></span></div><div><b>↑</b><span data-i="m2"></span></div><div><b>↓</b><span data-i="m3"></span></div></div>
  <p class="tip" data-i="tip"></p>
  <div class="themes">
    <button class="th" data-th="city"><i style="background:linear-gradient(#2a1f6b,#ff4f8b 60%,#ffb36b)"></i><span></span></button>
    <button class="th" data-th="jungle"><i style="background:linear-gradient(#4ab3e8,#9be0f2 55%,#2e9d5a)"></i><span></span></button>
    <button class="th" data-th="space"><i style="background:linear-gradient(#05031a,#1a1050 55%,#4a2a9a)"></i><span></span></button>
  </div>
  <button id="bCam" data-i="bCam"></button>
  <div class="row"><button class="ghost" id="bKey" data-i="bKey"></button><button class="ghost" id="bFlip"></button></div>
  <p id="st" class="tip"></p>
</div></div>

<div class="ov hide" id="over"><div class="card">
  <div class="seg"><button data-l="ms">BM</button><button data-l="en">EN</button></div>
  <h1 class="logo" data-i="over"></h1>
  <div class="big" id="bigS">0</div>
  <span class="nb hide" id="nb" data-i="nb"></span>
  <p id="res" class="tag"></p>
  <button id="bAgain" data-i="again" style="width:100%"></button>
  <button class="ghost" id="bRe" data-i="recal"></button>
</div></div>

<div id="calib" class="hide">
  <b data-i="cT"></b>
  <span id="cmsg" data-i="cM"></span>
  <div class="bar"><i id="cbar"></i></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('g'),cx=cv.getContext('2d'),vid=$('v'),oc=$('o');
const VJ='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

let W,H;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('br_best')||0}catch(e){}
const S={mode:'menu',px:1,jh:0,vy:0,air:false,duck:false,duckT:0,speed:14,dist:0,score:0,coins:0,lives:3,inv:0,shake:0,obs:[],cs:[],nextRow:35,t:0};
const C={lane:1,jump:false,cduck:false};       // kawalan
const P={why:'',ok:false,hx:null,sy:null,L:0.2,lastOk:0}; // pose semasa
const B={mx:.5,sy:.4,L:.2};                       // garis asas kalibrasi
const K={t0:0,sx:0,ss:0,sl:0,n:0};
let landmarker=null,stream=null,facing='user',camOn=false,lastVT=-1,fl=0;

const show=id=>$(id).classList.remove('hide'),hide=id=>$(id).classList.add('hide');
function dbg(t){$('dbg').textContent=t}
const setSt=t=>$('st').textContent=t;
function flash(t){const f=$('flash');f.textContent=t;f.style.opacity=1;clearTimeout(fl);fl=setTimeout(()=>f.style.opacity=0,800)}

const T={ms:{tag:'Lari guna gerakan badan!',tip:'Berdiri ±2 m dari kamera. Lompat penghadang kuning, tunduk bawah palang hijau, elak blok merah jambu.',m1:'Condong',m2:'Lompat',m3:'Tunduk',th_city:'Bandar Senja',th_jungle:'Hutan Pagi',th_space:'Angkasa',bCam:'📷 Mula guna kamera',bKey:'⌨️ Papan kekunci / swipe',flip:'🔄 Kamera: ',front:'depan',back:'belakang',over:'TAMAT!',nb:'REKOD BARU!',best:'Terbaik',again:'▶ Main lagi',recal:'🎯 Kalibrasi semula',cT:'Berdiri tegak di tengah',cM:'Pastikan bahu hingga pinggul nampak.',hold:'Tahan… jangan bergerak.',noP:'Tiada orang dikesan. Tambah cahaya dan undur sikit.',noSh:'Kedua-dua bahu mesti nampak. Undur sikit.',ok:'model OK · badan dikesan',up:' (separuh atas)',load:'Memuatkan model badan…',fail:'Gagal: ',failH:'Guna localhost/HTTPS dan benarkan kamera.',ouch:'💥 Aduh!',lost:'⚠️ Badan tak nampak'},
en:{tag:'Run with your whole body!',tip:'Stand about 2 m from the camera. Jump yellow barriers, duck under green bars, dodge pink blocks.',m1:'Lean',m2:'Jump',m3:'Duck',th_city:'Sunset City',th_jungle:'Morning Jungle',th_space:'Outer Space',bCam:'📷 Play with camera',bKey:'⌨️ Keyboard / swipe',flip:'🔄 Camera: ',front:'front',back:'back',over:'GAME OVER',nb:'NEW BEST!',best:'Best',again:'▶ Play again',recal:'🎯 Recalibrate',cT:'Stand tall in the middle',cM:'Keep your shoulders to hips in view.',hold:'Hold still…',noP:'No one found. Add light and step back.',noSh:'Both shoulders must be visible. Step back.',ok:'model OK · body detected',up:' (upper body)',load:'Loading body model…',fail:'Failed: ',failH:'Use localhost/HTTPS and allow the camera.',ouch:'💥 Ouch!',lost:"⚠️ Can't see you"}};
let lang='ms',theme='city';try{lang=localStorage.getItem('br_lang')||'ms';theme=localStorage.getItem('br_th')||'city'}catch(e){}
const t=k=>T[lang][k];
const TH={
 city:{sky:['#2a1f6b','#ff4f8b','#ffb36b'],haze:'rgba(255,179,107,',sun:'#ffe08a',sk:['#3a2a7a','#2a1f6b'],side:'#231a55',g1:'#2b1f66',g2:'#241a5a',off:.35,b1:'#3b2f86',b2:'#34287a',curb:['#ff4f8b','#fff'],pole:'#5a4cc4',knob:'#2de2c4',tw:1,kr:1.1},
 jungle:{sky:['#4ab3e8','#9be0f2','#fff1c9'],haze:'rgba(255,241,201,',sun:'#fff7b0',sk:['#2f8f5b','#1f7a4a'],side:'#2e7d4f',g1:'#3db368',g2:'#35a15d',off:.95,b1:'#d09a5e',b2:'#c38d52',curb:['#d94f3d','#fff3d6'],pole:'#7a4a24',knob:'#2ecb62',tw:2.2,kr:3.4},
 space:{sky:['#05031a','#1a1050','#4a2a9a'],haze:'rgba(74,42,154,',sun:'#cfe6ff',sk:['#2b1b6b','#3a2590'],side:'#0b0830',g1:'#100b45',g2:'#0b0830',off:.55,b1:'#2a2f6b',b2:'#242960',curb:['#2de2c4','#1b1740'],pole:'#6b5bff',knob:'#ff4f8b',tw:1,kr:1.8}};
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('.th').forEach(b=>{b.querySelector('span').textContent=t('th_'+b.dataset.th);b.classList.toggle('on',b.dataset.th===theme)});
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  $('bFlip').textContent=t('flip')+t(facing==='user'?'front':'back');
  try{localStorage.setItem('br_lang',lang);localStorage.setItem('br_th',theme)}catch(e){}
}

/* ---------- KAMERA + POSE ---------- */
async function initPose(){
  if(landmarker)return;
  const m=await import(VJ+'/vision_bundle.mjs');
  const fs=await m.FilesetResolver.forVisionTasks(VJ+'/wasm');
  const opt=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numPoses:1});
  try{landmarker=await m.PoseLandmarker.createFromOptions(fs,opt('GPU'))}
  catch(e){landmarker=await m.PoseLandmarker.createFromOptions(fs,opt('CPU'))}
}
async function startCam(){
  setSt(t('load'));
  try{
    await initPose();
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
    vid.srcObject=stream;await vid.play();
    camOn=true;$('cam').style.display='block';beginCalib();
  }catch(e){setSt(t('fail')+(e.message||e)+'. '+t('failH'))}
}
const PAIRS=[[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[11,13],[13,15],[12,14],[14,16]];
function drawSkel(lm){
  const w=vid.videoWidth||320,h=vid.videoHeight||240;
  if(oc.width!==w||oc.height!==h){oc.width=w;oc.height=h}
  const g=oc.getContext('2d');g.clearRect(0,0,w,h);
  if(!lm)return;
  g.strokeStyle='#2de2c4';g.lineWidth=4;
  for(const[a,b]of PAIRS){g.beginPath();g.moveTo(lm[a].x*w,lm[a].y*h);g.lineTo(lm[b].x*w,lm[b].y*h);g.stroke()}
  g.fillStyle='#ffc83d';
  for(const i of [11,12,23,24,25,26,27,28]){g.beginPath();g.arc(lm[i].x*w,lm[i].y*h,5,0,7);g.fill()}
}
function readPose(now){
  if(!camOn||!landmarker||vid.readyState<2||vid.currentTime===lastVT)return;
  lastVT=vid.currentTime;
  const r=landmarker.detectForVideo(vid,now);
  const lm=r.landmarks&&r.landmarks[0];
  drawSkel(lm);
  if(!lm){P.ok=false;P.why=t('noP');dbg(t('noP'));return}
  const v=i=>(lm[i].visibility??1)>.4&&lm[i].x>0&&lm[i].x<1&&lm[i].y>0&&lm[i].y<1;
  P.ok=v(11)&&v(12);
  if(!P.ok){P.why=t('noSh');dbg(t('noSh'));return}
  P.lastOk=now;
  const hipsOk=v(23)&&v(24),sw=Math.abs(lm[11].x-lm[12].x),a=.55;
  const hx=1-(lm[11].x+lm[12].x)/2,sy=(lm[11].y+lm[12].y)/2;
  P.hx=P.hx==null?hx:P.hx+(hx-P.hx)*a;
  P.sy=P.sy==null?sy:P.sy+(sy-P.sy)*a;
  P.L=hipsOk?(lm[23].y+lm[24].y)/2-sy:sw*1.2;
  dbg(t('ok')+(hipsOk?'':t('up')));
  if(S.mode==='calib')calibStep(now);else if(S.mode==='play')control();
}
function beginCalib(){
  S.mode='calib';P.hx=P.sy=null;K.t0=0;$('cbar').style.width='0';
  $('pad').style.display='none';hide('menu');hide('over');show('calib');$('cam').classList.add('big');
}
function calibStep(now){
  if(!P.ok){K.t0=0;$('cbar').style.width='0';$('cmsg').textContent=P.why||t('noSh');return}
  $('cmsg').textContent='Tahan… jangan bergerak.';
  if(!K.t0){K.t0=now;K.sx=K.ss=K.sl=K.n=0}
  K.sx+=P.hx;K.ss+=P.sy;K.sl+=P.L;K.n++;
  const p=(now-K.t0)/2000;$('cbar').style.width=Math.min(100,p*100)+'%';
  if(p>=1){B.mx=K.sx/K.n;B.sy=K.ss/K.n;B.L=Math.max(.06,K.sl/K.n);startGame()}
}
function control(){
  const dx=P.hx-B.mx,T=Math.max(.07,B.L*.4);
  let l=C.lane;
  if(dx<-T)l=0;else if(dx>T)l=2;else if(l===0&&dx>-T*.5)l=1;else if(l===2&&dx<T*.5)l=1;
  C.lane=l;
  const up=(B.sy-P.sy)/B.L,down=-up;
  if(up>.28&&!S.air)C.jump=true;
  if(down>.30)C.cduck=true;else if(down<.18)C.cduck=false;
  if(Math.abs(up)<.12&&l===1){B.sy+=(P.sy-B.sy)*.01;B.mx+=(P.hx-B.mx)*.01}
}

/* ---------- PERMAINAN ---------- */
function startGame(){
  Object.assign(S,{mode:'play',px:1,jh:0,vy:0,air:false,duck:false,duckT:0,speed:14,dist:0,score:0,coins:0,lives:3,inv:0,shake:0,obs:[],cs:[],nextRow:35});
  C.lane=1;C.jump=false;C.cduck=false;
  hide('menu');hide('over');hide('calib');$('cam').classList.remove('big');
  $('pad').style.display=camOn?'none':'flex';
  flash('GO!');
}
function spawnRow(z){
  const types=['block','low','high'],lanes=[0,1,2].sort(()=>Math.random()-.5),n=Math.random()<.3?2:1;
  for(let i=0;i<n;i++)S.obs.push({z,lane:lanes[i],type:types[Math.floor(Math.random()*3)]});
  if(Math.random()<.85)for(let k=0;k<4;k++)S.cs.push({z:z-14+k*3,lane:lanes[n]});
}
function crash(){
  S.lives--;S.inv=1.6;S.shake=.35;flash(t('ouch'));
  if(S.lives<=0){
    S.mode='over';
    const nb=S.score>best;
    if(nb){best=S.score;try{localStorage.setItem('br_best',best)}catch(e){}}
    $('bigS').textContent=S.score;
    $('res').textContent='🪙 '+S.coins+' · '+t('best')+' '+best;
    $('nb').classList.toggle('hide',!nb);
    show('over');$('pad').style.display='none';
  }
}
function update(dt){
  S.speed=Math.min(32,14+S.dist*.012);
  S.dist+=S.speed*dt;
  S.score=Math.floor(S.dist/2)+S.coins*10;
  S.px+=(C.lane-S.px)*Math.min(1,dt*14);
  if(C.jump){C.jump=false;if(!S.air){S.vy=7.8;S.air=true;S.duckT=0}}
  if(S.air){S.vy-=24*dt;S.jh+=S.vy*dt;if(S.jh<=0){S.jh=0;S.air=false;S.vy=0}}
  if(S.duckT>0)S.duckT-=dt;
  S.duck=!S.air&&(C.cduck||S.duckT>0);
  if(S.inv>0)S.inv-=dt;
  S.shake=Math.max(0,S.shake-dt*3);
  while(S.nextRow-S.dist<70){spawnRow(S.nextRow);S.nextRow+=S.speed*1.3+4+Math.random()*6}
  for(const o of S.obs){
    const d=o.z-S.dist;
    if(d<-3){o.dead=true;continue}
    if(!o.hit&&d<1&&d>-1&&Math.abs(S.px-o.lane)<.65){
      const hit=o.type==='block'||(o.type==='low'&&S.jh<.55)||(o.type==='high'&&!S.duck);
      if(hit&&S.inv<=0){o.hit=true;crash()}
    }
  }
  for(const c of S.cs){
    const d=c.z-S.dist;
    if(d<-3){c.dead=true;continue}
    if(!c.got&&d<1&&d>-1&&Math.abs(S.px-c.lane)<.6&&S.jh<1.1){c.got=true;S.coins++}
  }
  S.obs=S.obs.filter(o=>!o.dead);S.cs=S.cs.filter(c=>!c.dead);
  if(camOn&&performance.now()-P.lastOk>1500)flash(t('lost'));
}

/* ---------- LUKISAN ---------- */
const SKY=[];{let x=0;while(x<1){const w=.04+Math.random()*.06;SKY.push({x,w,h:.03+Math.random()*.1,c:Math.random()<.5?0:1});x+=w}}
const STARS=Array.from({length:70},()=>[Math.random(),Math.random(),Math.random()+.4]);
const rnd=(()=>{let a=11;return()=>{a=a*16807%2147483647;return(a-1)/2147483646}})();

    const aa=S.air?0:sw*sd;
    cx.save();cx.translate(x+sd*bw*.54,ty+torH*.14);
    cx.rotate(S.air?-sd*2.6:sd*(dk?.22:.1-.09*aa));
    const len=torH*(S.air?.62:.62*(1-.32*aa)*(dk?.8:1));
    rr(-bw*.11,0,bw*.22,len,7,'#ff9f1c');
    rr(-bw*.11,len*.74,bw*.22,torH*.1,3,'#fff');
    circ(0,len+bw*.07,bw*.12,SK);
    cx.restore();
  }
  /* badan: jaket kuning */
  let jg=cx.createLinearGradient(x-bw/2,0,x+bw/2,0);jg.addColorStop(0,'#ffb81f');jg.addColorStop(.35,'#ffd95e');jg.addColorStop(1,'#f5a400');
  rr(x-bw/2,ty,bw,torH,11,jg);
  rr(x-bw/2,ty+torH*.66,bw,torH*.14,0,'#ff4f8b');
  /* beg galas */
  let bg=cx.createLinearGradient(x-bw*.32,0,x+bw*.32,0);bg.addColorStop(0,'#17a68c');bg.addColorStop(.4,'#2ee0c2');bg.addColorStop(1,'#12907a');
  rr(x-bw*.32,ty+torH*.06,bw*.64,torH*.72,9,bg);
  rr(x-bw*.32,ty+torH*.06,bw*.64,torH*.16,9,'#7ff5de');
  rr(x-bw*.2,ty+torH*.42,bw*.4,torH*.26,6,'#17a68c');
  rr(x-bw*.2,ty+torH*.42,bw*.4,torH*.05,3,'#5ff0d6');
  rr(x-bw*.015,ty+torH*.3,bw*.03,torH*.12,0,'#0d6f5e');
  circ(x,ty+torH*.3,bw*.035,'#ffd75e');
  for(const sd of[-1,1])rr(x+sd*bw*.4-bw*.03,ty+torH*.02,bw*.06,torH*.55,3,'#ff9f1c');
  /* leher + kepala dari belakang */
  rr(x-hr*.38,ty-hr*.5,hr*.76,hr*.7,4,SK);rr(x-hr*.38,ty-hr*.5,hr*.76,hr*.18,4,SKD);
  const hy=ty-hr*(dk?.3:.75);
  circ(x-hr*.98,hy+hr*.2,hr*.24,SK);circ(x+hr*.98,hy+hr*.2,hr*.24,SK);
  circ(x-hr*.98,hy+hr*.2,hr*.12,SKD);circ(x+hr*.98,hy+hr*.2,hr*.12,SKD);
  circ(x,hy,hr,'#3a2216');
  cx.fillStyle='#4e2f1d';cx.beginPath();cx.ellipse(x,hy+hr*.35,hr*.8,hr*.5,0,0,7);cx.fill();
  /* topi kupluk */
  let cg=cx.createLinearGradient(x-hr,0,x+hr,0);cg.addColorStop(0,'#d6336f');cg.addColorStop(.4,'#ff5d97');cg.addColorStop(1,'#c02a62');
  cx.fillStyle=cg;cx.beginPath();cx.arc(x,hy,hr*1.04,Math.PI,Math.PI*2);cx.lineTo(x+hr*1.04,hy-hr*.05);cx.lineTo(x-hr*1.04,hy-hr*.05);cx.closePath();cx.fill();
  cx.fillStyle='rgba(255,255,255,.35)';cx.beginPath();cx.ellipse(x-hr*.4,hy-hr*.62,hr*.28,hr*.13,-.5,0,7);cx.fill();
  rr(x-hr*1.08,hy-hr*.3,hr*2.16,hr*.34,hr*.16,'#ff9fc4');
  cx.fillStyle='#d6336f';for(let i=-4;i<=4;i++)cx.fillRect(x+i*hr*.22-hr*.025,hy-hr*.27,hr*.05,hr*.28);
  circ(x,hy-hr*1.06,hr*.27,'#fff');circ(x-hr*.07,hy-hr*1.12,hr*.1,'#e9f3ff');
}

/* ---------- LOOP ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;S.t+=dt;
  try{
    readPose(now);
    if(S.mode==='play')update(dt);else if(S.mode!=='over')S.dist+=dt*8;
    draw();
  }catch(e){dbg('Ralat: '+e.message)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- INPUT ---------- */
$('bCam').onclick=startCam;
$('bKey').onclick=()=>{camOn=false;startGame()};
$('bFlip').onclick=()=>{facing=facing==='user'?'environment':'user';applyLang();if(camOn)startCam()};
$('bAgain').onclick=startGame;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang()});
document.querySelectorAll('.th').forEach(b=>b.onclick=()=>{theme=b.dataset.th;applyLang()});
applyLang();
$('bRe').onclick=()=>{if(camOn)beginCalib();else{hide('over');show('menu')}};
function act(a){
  if(S.mode!=='play')return;
  if(a==='L')C.lane=Math.max(0,C.lane-1);
  else if(a==='R')C.lane=Math.min(2,C.lane+1);
  else if(a==='U')C.jump=true;
  else S.duckT=.7;
}
const KM={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',' ':'U',ArrowDown:'D',s:'D'};
document.addEventListener('keydown',e=>{
  const m=KM[e.key];
  if(m){e.preventDefault();if(!e.repeat)act(m)}
  else if(e.key==='Enter'&&S.mode==='over')startGame();
});
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.a)}));
cv.addEventListener('pointerdown',()=>window.focus());
addEventListener('error',e=>dbg('Ralat: '+e.message));
let t0=null;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];t0=[t.clientX,t.clientY]},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!t0||S.mode!=='play'||camOn)return;
  const t=e.changedTouches[0],dx=t.clientX-t0[0],dy=t.clientY-t0[1];t0=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
  if(Math.abs(dx)>Math.abs(dy))C.lane=Math.max(0,Math.min(2,C.lane+(dx>0?1:-1)));
  else if(dy<0)C.jump=true;else S.duckT=.7;
});
</script>
