<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tulis Udara">
<meta name="theme-color" content="#12251d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Tulis Udara</title>
<style>
  :root{--bg:#12251d;--ink:#fff7e0;--accent:#ffb627;--panel:rgba(16,40,31,.9)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  video{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #st{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--accent);border-radius:999px;padding:8px 18px;font-size:20px;font-weight:700;display:none;white-space:nowrap}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border:2px solid var(--accent);border-radius:28px;max-width:96vw}
  .sw{width:48px;height:48px;border-radius:50%;border:4px solid transparent;padding:0}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .b{background:transparent;color:var(--ink);border:2px solid var(--accent);border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;font-size:16px}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;background:var(--panel)}
  h1{font-size:clamp(40px,9vw,72px);margin:0;color:var(--accent);letter-spacing:-1px}
  ul{list-style:none;margin:0;padding:0;font-size:19px;line-height:1.9;text-align:left}
  #go{background:var(--accent);color:#1b1300;border:0;border-radius:14px;padding:16px 34px;font:inherit;font-size:22px;font-weight:800;margin-top:6px}
  #go:disabled{opacity:.6}
  #msg{min-height:22px;font-size:15px;color:#ffd9a0}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<div id="st"></div>
<div id="bar"></div>
<div id="menu">
  <h1>Tulis Udara</h1>
  <ul>
    <li>🤏 Pinch (ibu jari + telunjuk) = <b>tulis</b></li>
    <li>☝️ Lepas pinch = <b>kursor</b></li>
    <li>🖐 Tapak terbuka (lima jari) = <b>padam</b></li>
    <li>✊ Genggam 1 saat = <b>padam semua</b></li>
    <li>Pinch pada butang di bawah untuk menekannya</li>
  </ul>
  <button id="go">Mula</button>
  <div id="msg"></div>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const v=$("v"),c=$("c"),ctx=c.getContext("2d");
const ink=document.createElement("canvas"),ictx=ink.getContext("2d");
let W,H,D=1;
function saiz(){
  D=devicePixelRatio||1;W=innerWidth;H=innerHeight;
  const old=document.createElement("canvas");old.width=ink.width;old.height=ink.height;
  if(ink.width)old.getContext("2d").drawImage(ink,0,0);
  c.width=ink.width=W*D;c.height=ink.height=H*D;
  ctx.setTransform(D,0,0,D,0,0);ictx.setTransform(D,0,0,D,0,0);
  if(old.width)ictx.drawImage(old,0,0,W,H);
}
addEventListener("resize",saiz);saiz();

let hand=null,facing="user",jalan=false,cermin=true,latar=0,lastV=-1;
const WARNA=["#ffffff","#ffd23f","#4fd1ff","#ff7ab6","#7dff8a"],TEBAL=[3,6,12,20];
let warna=WARNA[0],ti=1,tebal=TEBAL[ti];

// ---- Bar alat ----
const bar=$("bar");
WARNA.forEach((w,i)=>{const b=document.createElement("button");b.className="sw"+(i?"":" on");b.style.background=w;b.dataset.tap=1;b.setAttribute("aria-label","Warna "+(i+1));
  b.onclick=()=>{warna=w;bar.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b))};bar.appendChild(b)});
function btn(id,txt,fn){const b=document.createElement("button");b.id=id;b.className="b";b.dataset.tap=1;b.textContent=txt;b.onclick=fn;bar.appendChild(b);return b}
const bG=btn("bg","Gerak: Mutlak",()=>{relatif=!relatif;sm=null;bG.textContent="Gerak: "+(relatif?"Trackpad":"Mutlak")});
const bT=btn("bt","Tebal: "+tebal,()=>{ti=(ti+1)%TEBAL.length;tebal=TEBAL[ti];bT.textContent="Tebal: "+tebal});
const bL=btn("bl","Latar: Kamera",()=>{latar=1-latar;bL.textContent="Latar: "+(latar?"Papan":"Kamera")});
const bM=btn("bm","Cermin: ON",()=>{cermin=!cermin;bM.textContent="Cermin: "+(cermin?"ON":"OFF")});
btn("bc","Tukar kamera",async()=>{facing=facing==="user"?"environment":"user";cermin=facing==="user";bM.textContent="Cermin: "+(cermin?"ON":"OFF");try{await bukaKamera()}catch(e){}});
btn("bx","Kosongkan",()=>ictx.clearRect(0,0,W,H));

// ---- Kamera & model ----
function peta(px,py){const vw=v.videoWidth||640,vh=v.videoHeight||480,s=Math.max(W/vw,H/vh);let x=px*vw*s+(W-vw*s)/2;const y=py*vh*s+(H-vh*s)/2;if(cermin)x=W-x;return[x,y]}
async function bukaKamera(){
  if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});
  await v.play();
}
async function muat(){
  const m=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
  const vis=await m.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const baseOptions={modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"};
  try{hand=await m.HandLandmarker.createFromOptions(vis,{baseOptions:{...baseOptions,delegate:"GPU"},runningMode:"VIDEO",numHands:1})}
  catch(e){hand=await m.HandLandmarker.createFromOptions(vis,{baseOptions,runningMode:"VIDEO",numHands:1})}
}

// ---- Gerak isyarat ----
const LABEL={tiada:"Tunjuk tangan ke kamera",kursor:"☝️ Kursor",tulis:"✍️ Tulis",padam:"🖐 Padam",genggam:"✊ Tahan untuk padam semua"};
const jari={x:0,y:0,ada:false};
let relatif=false,sm=null,prev=null,berus=null;const DELAY=4,GAIN=2.2;
let mod="tiada",cand="",cnt=0,pinching=false,lp,pm,ep,tapLock=false,t0=0,sudah=false;
const PR=()=>Math.max(36,Math.min(W,H)*.08);

function baca(L){
  const vw=v.videoWidth||640,vh=v.videoHeight||480;
  const d=(i,j)=>Math.hypot((L[i].x-L[j].x)*vw,(L[i].y-L[j].y)*vh);
  const size=d(0,9)||1;
  const n=[[8,6],[12,10],[16,14],[20,18]].filter(([t,p])=>d(t,0)>d(p,0)*1.15).length;
  return{pinch:d(4,8)/size,n,terbuka:n===4&&d(4,17)>size};
}
function ganti(m){
  if(mod==="tulis")tapLock=false;
  berus=m==="tulis"?{pts:[],n:0}:null;
  mod=m;
  if(m==="genggam"){t0=performance.now();sudah=false}
  $("st").textContent=LABEL[m];
}
function tulisTitik(x,y,baru){
  ictx.strokeStyle=ictx.fillStyle=warna;ictx.lineWidth=tebal;ictx.lineCap=ictx.lineJoin="round";
  if(baru){lp={x,y};pm={x,y};ictx.beginPath();ictx.arc(x,y,tebal/2,0,7);ictx.fill();return}
  const m={x:(lp.x+x)/2,y:(lp.y+y)/2};
  ictx.beginPath();ictx.moveTo(pm.x,pm.y);ictx.quadraticCurveTo(lp.x,lp.y,m.x,m.y);ictx.stroke();
  lp={x,y};pm=m;
}
function padamTitik(x,y,baru){
  if(baru)ep={x,y};
  ictx.save();ictx.globalCompositeOperation="destination-out";ictx.lineCap="round";ictx.lineWidth=PR()*2;
  ictx.beginPath();ictx.moveTo(ep.x,ep.y);ictx.lineTo(x,y);ictx.stroke();ictx.restore();
  ep={x,y};
}
function kesan(){
  if(!hand||v.readyState<2||v.currentTime===lastV)return;
  lastV=v.currentTime;
  const r=hand.detectForVideo(v,performance.now());
  if(!r.landmarks.length){if(jari.ada)ganti("tiada");jari.ada=false;cand="";cnt=0;sm=null;return}
  const L=r.landmarks[0],g=baca(L);
  pinching=pinching?g.pinch<.27:g.pinch<.19;
  const m=pinching?"tulis":g.terbuka?"padam":(g.n===0&&g.pinch>.5)?"genggam":"kursor";
  if(m===cand)cnt++;else{cand=m;cnt=1}
  const p=(m==="padam"||m==="genggam")?{x:(L[0].x+L[9].x)/2,y:(L[0].y+L[9].y)/2}:L[8];
  const [tx,ty]=peta(p.x,p.y);
  jari.ada=true;
  let tukar=false;
  if(cnt>=2&&m!==mod){ganti(m);tukar=true}
  if(!sm||tukar){sm={x:tx,y:ty};prev={x:tx,y:ty}}
  else{prev={x:sm.x,y:sm.y};sm.x+=(tx-sm.x)*.5;sm.y+=(ty-sm.y)*.5}
  if(relatif){
    jari.x=Math.max(0,Math.min(W,jari.x+(sm.x-prev.x)*GAIN));
    jari.y=Math.max(0,Math.min(H,jari.y+(sm.y-prev.y)*GAIN));
  }else{jari.x=sm.x;jari.y=sm.y}
  if(mod==="tulis"){
    if(tukar){const el=document.elementFromPoint(jari.x,jari.y)?.closest("[data-tap]");if(el){tapLock=true;el.click()}}
    if(!tapLock&&berus){
      berus.pts.push({x:jari.x,y:jari.y});
      while(berus.pts.length-berus.n>DELAY){const q=berus.pts[berus.n];tulisTitik(q.x,q.y,berus.n===0);berus.n++}
    }
  }else if(mod==="padam")padamTitik(jari.x,jari.y,tukar);
  else if(mod==="genggam"&&!sudah&&performance.now()-t0>1000){ictx.clearRect(0,0,W,H);sudah=true}
}

// ---- Lukis ----
function lukis(){
  ctx.clearRect(0,0,W,H);
  if(latar===0&&v.readyState>=2){
    const vw=v.videoWidth,vh=v.videoHeight,s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s;
    ctx.save();if(cermin){ctx.translate(W,0);ctx.scale(-1,1)}
    ctx.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);ctx.restore();
    ctx.fillStyle="rgba(10,30,20,.4)";ctx.fillRect(0,0,W,H);
  }else{ctx.fillStyle="#12251d";ctx.fillRect(0,0,W,H)}
  ctx.drawImage(ink,0,0,W,H);
  if(!jari.ada)return;
  const {x,y}=jari;
  ctx.lineWidth=3;ctx.strokeStyle="#fff";
  if(mod==="tulis"){ctx.beginPath();ctx.arc(x,y,tebal/2+3,0,7);ctx.fillStyle=warna;ctx.fill();ctx.stroke()}
  else if(mod==="padam"){ctx.beginPath();ctx.arc(x,y,PR(),0,7);ctx.fillStyle="rgba(255,255,255,.15)";ctx.fill();ctx.setLineDash([10,8]);ctx.stroke();ctx.setLineDash([])}
  else if(mod==="genggam"){
    const f=sudah?1:Math.min(1,(performance.now()-t0)/1000);
    ctx.strokeStyle="#ff5a4e";ctx.lineWidth=8;ctx.beginPath();ctx.arc(x,y,36,-Math.PI/2,-Math.PI/2+f*Math.PI*2);ctx.stroke();
  }else{ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.stroke();ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fillStyle=warna;ctx.fill()}
}
function gelung(){kesan();lukis();requestAnimationFrame(gelung)}

$("go").onclick=async()=>{
  $("go").disabled=true;$("msg").textContent="";
  try{
    if(!jalan){
      $("msg").textContent="Membuka kamera dan memuat model...";
      await bukaKamera();await muat();jalan=true;requestAnimationFrame(gelung);
    }
    ictx.clearRect(0,0,W,H);jari.x=W/2;jari.y=H/2;sm=null;ganti("tiada");
    $("menu").style.display="none";$("st").style.display="block";bar.style.display="flex";
  }catch(e){
    $("msg").textContent="Gagal: benarkan kamera dan pastikan guna https atau localhost, serta ada internet.";
    $("go").disabled=false;
  }
};
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
